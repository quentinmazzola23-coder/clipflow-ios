name: Build IPA (non signée)

# Compile ClipFlow sur un runner macOS GitHub et produit une IPA NON SIGNÉE.
# La signature est faite ensuite sur le PC Windows par Sideloadly avec
# l'identifiant Apple personnel (gratuit, validité 7 jours).

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nécessaire pour publier l'IPA en release avec le jeton par défaut.
permissions:
  contents: write

jobs:
  build:
    # Image macOS avec Xcode 26 (SDK iOS 26 requis par le projet).
    # AUCUNE action GitHub (uses:) dans ce job : clone git direct et publication
    # en release via gh préinstallé — insensible aux pannes du service de
    # résolution d'actions ("Failed to resolve action download info").
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - name: Cloner le dépôt
        run: |
          git clone --depth 1 --branch "${GITHUB_REF_NAME}" \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" src

      - name: Sélectionner Xcode 26 si présent
        run: |
          XCODE_26=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$XCODE_26" ]; then
            sudo xcode-select -s "$XCODE_26"
          fi
          xcodebuild -version

      - name: Générer BuildInfo (n° de build + horodatage)
        working-directory: src
        run: |
          cat > ClipFlow/BuildInfo.swift <<EOF
          enum BuildInfo {
              static let version = "1.0"
              static let build = "${{ github.run_number }}"
              static let stamp = "$(TZ=Europe/Paris date '+%d/%m/%Y %H:%M')"
          }
          EOF
          cat ClipFlow/BuildInfo.swift

      - name: Compiler (sans signature)
        working-directory: src
        run: |
          set -o pipefail
          xcodebuild \
            -project ClipFlow.xcodeproj \
            -scheme ClipFlow \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Empaqueter l'IPA
        working-directory: src
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/ClipFlow.app" Payload/
          zip -qry ClipFlow-unsigned.ipa Payload
          ls -la ClipFlow-unsigned.ipa

      - name: Publier en release
        working-directory: src
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}-r${{ github.run_attempt }}"
          gh release create "$TAG" ClipFlow-unsigned.ipa \
            --title "IPA $TAG (${GITHUB_SHA:0:7})" \
            --notes "IPA non signée — à signer avec Sideloadly. IMPORTANT : laisser « Remove app extensions » DÉCOCHÉ (PlugIns/ClipFlowWidgets.appex rend la Live Activity/Dynamic Island ; sans lui, l'app fonctionne mais l'île reste muette, sans erreur). Compte gratuit : app + extension = 2 App IDs sur 10/7 jours à la PREMIÈRE signature ; re-signer les mêmes bundle IDs (mode Automatic) ne reconsomme rien. En cas d'erreur « maximum App IDs », attendre la fenêtre de 7 jours plutôt que de retirer l'extension." \
            -R "${{ github.repository }}"

  tests:
    runs-on: macos-26
    timeout-minutes: 40
    continue-on-error: true # informatif : l'IPA reste produite même si un test casse

    steps:
      - uses: actions/checkout@v4

      - name: Sélectionner Xcode 26 si présent
        run: |
          XCODE_26=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$XCODE_26" ]; then
            sudo xcode-select -s "$XCODE_26"
          fi
          xcodebuild -version

      - name: Tests unitaires (simulateur)
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available | grep -m1 -oE "iPhone [0-9]+[^(]*" | head -1 | xargs || echo "iPhone 16 Pro")
          echo "Simulateur : $DEVICE"
          xcodebuild \
            -project ClipFlow.xcodeproj \
            -scheme ClipFlow \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            CODE_SIGNING_ALLOWED=NO \
            test

  # BANC D'ESSAI DU VRAI MOTEUR (flux optique VideoToolbox).
  # Le simulateur n'embarque pas VTFrameProcessor et la variante « Designed
  # for iPad » exige une identité de signature qu'un runner n'a pas. Le paquet
  # Swift ClipFlowPipeline compile LES MÊMES fichiers sources du pipeline pour
  # macOS (Apple Silicon) : `swift test` s'exécute sans aucune signature, avec
  # le vrai moteur. Objectif : les artefacts sont constatés par la machine ici,
  # plus par l'utilisateur sur son iPhone.
  # Non bloquant tant que la disponibilité du moteur sur le runner n'est pas
  # confirmée (les tests se SAUTENT proprement s'il est absent).
  moteur-reel:
    # Court exprès : un banc d'essai bloqué doit le dire vite, pas consommer
    # trois quarts d'heure de runner en silence.
    runs-on: macos-26
    timeout-minutes: 20
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Sélectionner Xcode 26 si présent
        run: |
          XCODE_26=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$XCODE_26" ]; then
            sudo xcode-select -s "$XCODE_26"
          fi
          xcodebuild -version
          swift --version
          uname -m
          sw_vers

      - name: Synchroniser les sources du pipeline vers le banc d'essai
        run: bash PipelineHarness/sync-sources.sh

      - name: Compilation du banc d'essai (diagnostic séparé)
        run: |
          set -o pipefail
          swift build --build-tests --package-path . 2>&1 | tail -40

      # SONDE D'ABORD : elle seule répond à « le flux optique existe-t-il ici,
      # et si oui, à quelle étape ça bloque ». Sortie EN DIRECT (surtout pas de
      # redirection vers `tail`, qui masquait tout jusqu'à la fin), chien de
      # garde qui échantillonne les piles d'appels avant de tuer.
      - name: Sonde du moteur (disponibilité, session, une interpolation)
        run: |
          bash PipelineHarness/run-with-watchdog.sh 300 \
            swift test --package-path . --filter EngineProbeTests

      # Rendus adversariaux de bout en bout. Sur une machine sans flux optique
      # utilisable, ils s'exécutent avec le moteur de repli : plan, décodage,
      # encodage, détecteur d'anomalies et boucle de réparation sont validés
      # quand même — c'est là qu'était le défaut critique des images copiées.
      - name: Banc d'essai complet (rendus adversariaux)
        run: |
          bash PipelineHarness/run-with-watchdog.sh 600 \
            swift test --package-path . --filter RealEngineArtifactTests
